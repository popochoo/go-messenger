services:
  gomessenger-postgres:
    image: postgres:18-bookworm
    container_name: gomessenger-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  gomessenger-redis:
    image: redis:8.6-alpine
    container_name: gomessenger-env-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ${PROJECT_ROOT}/out/redisdata:/data
    restart: always

  gomessenger-postgres-port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: gomessenger-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:gomessenger-postgres:5432
    ports:
      - "${POSTGRES_HOST}:${POSTGRES_PORT}:5432"
    depends_on:
      - gomessenger-postgres

  gomessenger-redis-port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: gomessenger-redis-port-forwarder
    command: tcp-listen:6379,fork,reuseaddr tcp-connect:gomessenger-redis:6379
    ports:
      - "${REDIS_HOST}:${REDIS_PORT}:6379"
    depends_on:
      - gomessenger-redis
  
  gomessenger-postgres-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
